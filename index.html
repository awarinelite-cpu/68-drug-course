<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#111827" />
    <title>68 NARHY Ward Charts</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('wardcharts-app-theme');
          if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
    <style>
      /* Static, no-JS loading screen. #root is empty until React mounts,
         which on a slower desktop can take a couple of seconds (download +
         parse + execute the app bundle, then resolve the auth state) — with
         nothing here, that gap was a plain blank white page. This paints
         the instant the HTML/CSS parses, before any script runs, and gets
         wiped out automatically the moment React renders over #root. */
      #boot-loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: #F3F4F9; font-family: Arial, Helvetica, sans-serif;
      }
      html[data-theme="dark"] #boot-loading { background: #0B1F3A; }
      #boot-loading .spinner {
        width: 40px; height: 40px; border-radius: 50%;
        border: 4px solid rgba(48,112,199,0.25); border-top-color: #3070C7;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot-loading .label { font-size: 15px; font-weight: bold; color: #1B3266; }
      html[data-theme="dark"] #boot-loading .label { color: #E5E7EB; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot-loading"><div class="spinner"></div><div class="label">68 NARHY Ward Charts</div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
