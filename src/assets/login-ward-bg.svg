<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF3FF"/>
      <stop offset="60%" stop-color="#F3F8FF"/>
      <stop offset="100%" stop-color="#FBFDFF"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCEBFF"/>
      <stop offset="100%" stop-color="#EEF5FF"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8E4F2"/>
      <stop offset="100%" stop-color="#C7D7EA"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrubBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3070C7"/>
      <stop offset="100%" stop-color="#1B3266"/>
    </linearGradient>
    <linearGradient id="scrubTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12B8A6"/>
      <stop offset="100%" stop-color="#0C8C7E"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="url(#sky)"/>
  <rect x="0" y="0" width="1600" height="680" fill="url(#wall)"/>
  <circle cx="800" cy="120" r="420" fill="url(#glow)"/>
  <rect x="0" y="640" width="1600" height="60" fill="#C9D8EC"/>
  <rect x="0" y="700" width="1600" height="300" fill="url(#floor)"/>

  <!-- large soft window with a plus / care symbol -->
  <rect x="1180" y="70" width="300" height="380" rx="18" fill="#FFFFFF" fill-opacity="0.55" stroke="#BFD4EF" stroke-width="6"/>
  <line x1="1330" y1="70" x2="1330" y2="450" stroke="#BFD4EF" stroke-width="6"/>
  <line x1="1180" y1="260" x2="1480" y2="260" stroke="#BFD4EF" stroke-width="6"/>
  <g opacity="0.55">
    <rect x="1300" y="150" width="60" height="180" rx="14" fill="#7FB8F5"/>
    <rect x="1240" y="210" width="180" height="60" rx="14" fill="#7FB8F5"/>
  </g>

  <!-- three ward beds along the back wall -->
  <g id="bed1">
    <rect x="90" y="330" width="270" height="140" rx="16" fill="#FFFFFF" stroke="#CBDCF2" stroke-width="4"/>
    <rect x="90" y="330" width="270" height="34" rx="14" fill="#E7EFFB"/>
    <ellipse cx="150" cy="352" rx="42" ry="20" fill="#FFFFFF" stroke="#CBDCF2" stroke-width="3"/>
    <rect x="120" y="380" width="220" height="70" rx="14" fill="#BFE3D6"/>
    <rect x="70" y="440" width="14" height="60" rx="6" fill="#AFC2DC"/>
    <rect x="366" y="440" width="14" height="60" rx="6" fill="#AFC2DC"/>
  </g>
  <g id="bed2">
    <rect x="440" y="300" width="270" height="140" rx="16" fill="#FFFFFF" stroke="#CBDCF2" stroke-width="4"/>
    <rect x="440" y="300" width="270" height="34" rx="14" fill="#E7EFFB"/>
    <ellipse cx="500" cy="322" rx="42" ry="20" fill="#FFFFFF" stroke="#CBDCF2" stroke-width="3"/>
    <rect x="470" y="350" width="220" height="70" rx="14" fill="#F7CFA1"/>
    <rect x="420" y="410" width="14" height="60" rx="6" fill="#AFC2DC"/>
    <rect x="716" y="410" width="14" height="60" rx="6" fill="#AFC2DC"/>
  </g>
  <g id="bed3">
    <rect x="1230" y="470" width="290" height="150" rx="16" fill="#FFFFFF" stroke="#CBDCF2" stroke-width="4"/>
    <rect x="1230" y="470" width="290" height="34" rx="14" fill="#E7EFFB"/>
    <ellipse cx="1294" cy="493" rx="44" ry="21" fill="#FFFFFF" stroke="#CBDCF2" stroke-width="3"/>
    <rect x="1262" y="522" width="234" height="74" rx="14" fill="#D9CBF2"/>
    <rect x="1210" y="588" width="14" height="62" rx="6" fill="#AFC2DC"/>
    <rect x="1526" y="588" width="14" height="62" rx="6" fill="#AFC2DC"/>
  </g>

  <!-- rolling IV stand beside bed 2 -->
  <g id="ivstand">
    <line x1="760" y1="270" x2="760" y2="470" stroke="#9FB3CE" stroke-width="6"/>
    <line x1="726" y1="270" x2="794" y2="270" stroke="#9FB3CE" stroke-width="6"/>
    <circle cx="740" cy="290" r="16" fill="#EAF4FF" stroke="#9FB3CE" stroke-width="4"/>
    <circle cx="780" cy="290" r="16" fill="#EAF4FF" stroke="#9FB3CE" stroke-width="4"/>
    <ellipse cx="760" cy="474" rx="34" ry="8" fill="#9FB3CE"/>
  </g>

  <!-- privacy curtain, softly gathered, between the beds -->
  <path d="M400 300 Q415 400 400 470 Q425 400 410 300 Q440 400 420 470 Q450 395 430 300"
        fill="#EAD9F5" fill-opacity="0.75"/>

  <!-- two nurses, centered, interacting over a clipboard -->
  <g id="nurse-left" transform="translate(660,560)">
    <ellipse cx="0" cy="330" rx="70" ry="16" fill="#000000" opacity="0.06"/>
    <path d="M-58 330 C-58 200 -30 150 0 150 C30 150 58 200 58 330 Z" fill="url(#scrubBlue)"/>
    <circle cx="0" cy="96" r="52" fill="#F4C6A0"/>
    <path d="M-52 70 A52 52 0 0 1 52 70 L52 92 A52 40 0 0 0 -52 92 Z" fill="#FFFFFF"/>
    <path d="M-56 66 A56 30 0 0 1 56 66 L52 40 A54 26 0 0 0 -52 40 Z" fill="#FFFFFF"/>
    <rect x="-18" y="200" width="60" height="78" rx="10" fill="#FFFFFF" transform="rotate(-8)"/>
    <rect x="-14" y="206" width="52" height="8" rx="3" fill="#BFD4EF" transform="rotate(-8)"/>
    <rect x="-14" y="220" width="52" height="8" rx="3" fill="#BFD4EF" transform="rotate(-8)"/>
    <rect x="-14" y="234" width="34" height="8" rx="3" fill="#BFD4EF" transform="rotate(-8)"/>
  </g>

  <g id="nurse-right" transform="translate(900,560) scale(-1,1)">
    <ellipse cx="0" cy="330" rx="70" ry="16" fill="#000000" opacity="0.06"/>
    <path d="M-58 330 C-58 200 -30 150 0 150 C30 150 58 200 58 330 Z" fill="url(#scrubTeal)"/>
    <circle cx="0" cy="96" r="52" fill="#E3AE86"/>
    <path d="M-52 70 A52 52 0 0 1 52 70 L52 92 A52 40 0 0 0 -52 92 Z" fill="#FFFFFF"/>
    <path d="M-56 66 A56 30 0 0 1 56 66 L52 40 A54 26 0 0 0 -52 40 Z" fill="#FFFFFF"/>
    <path d="M20 175 Q70 160 78 200" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
    <circle cx="79" cy="204" r="9" fill="#FFFFFF"/>
    <path d="M-30 190 Q-10 214 20 196" fill="none" stroke="#0C8C7E" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- gentle foreground plant for warmth -->
  <g id="plant" transform="translate(1500,760)">
    <rect x="-30" y="60" width="60" height="70" rx="10" fill="#B7CBE3"/>
    <path d="M0 60 C-10 10 -60 -10 -70 -50 C-30 -40 -5 -5 0 40 Z" fill="#7FB89A"/>
    <path d="M0 60 C10 5 55 -15 68 -55 C30 -42 8 -8 0 40 Z" fill="#5FA07F"/>
    <path d="M0 60 C0 0 0 -30 0 -60 C-6 -25 -3 10 0 45 Z" fill="#8FCBA9"/>
  </g>

  <rect x="0" y="0" width="1600" height="1000" fill="#0B1F4D" opacity="0.04"/>
</svg>
