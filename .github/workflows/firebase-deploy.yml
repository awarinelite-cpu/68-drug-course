name: Deploy Firestore/Storage Rules

# Frontend hosting is handled by Vercel (connected directly to this repo).
# The app runs on the free Firebase (Spark) plan with NO Cloud Functions, so
# this workflow only deploys the Firestore and Storage security rules.
on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-sa.json

      - name: Deploy Firestore rules
        run: npx firebase-tools deploy --only firestore:rules --project gen-lang-client-0406053716 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json

      - name: Deploy Storage rules
        run: npx firebase-tools deploy --only storage --project gen-lang-client-0406053716 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
