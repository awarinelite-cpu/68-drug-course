name: Deploy Firebase Functions & Firestore Rules

# Frontend hosting is handled by Vercel (connected directly to this repo) —
# this workflow only covers the backend pieces Vercel doesn't touch:
# Cloud Functions and Firestore security rules.
on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install functions dependencies
        run: npm install
        working-directory: functions

      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-sa.json

      - name: Deploy Firestore rules
        run: npx firebase-tools deploy --only firestore:rules --project gen-lang-client-0406053716 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json

      - name: Deploy Cloud Functions
        run: npx firebase-tools deploy --only functions --project gen-lang-client-0406053716 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
