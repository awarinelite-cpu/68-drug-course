name: Build Android Debug APK

# Runs on every push to main that touches app/web or native Android code,
# plus manual runs from the Actions tab (Run workflow button) for
# on-demand builds. Same pattern as MedIndex-'s android-debug.yml.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # Optional: only present if you've added the GOOGLE_SERVICES_JSON
      # secret in repo Settings → Secrets and variables → Actions (paste the
      # full contents of the google-services.json downloaded from Firebase
      # Console → Project settings → your registered Android app,
      # com.narhy.wardcharts). Without it, the app still builds fine —
      # Firebase push notifications (drug-due/glucose-check alerts) just
      # won't be wired up in this APK, same as android/app/build.gradle's
      # own fallback when the file is missing locally.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON secret set; skipping (push notifications won't work in this build)."
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: narhy-ward-charts-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
