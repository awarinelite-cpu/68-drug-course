name: Build Android Debug APK

# Runs on every push to main that touches app/web or native Android code,
# plus manual runs from the Actions tab (Run workflow button) for
# on-demand builds. Same pattern as MedIndex-'s android-debug.yml.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch: {}

permissions:
  contents: write   # lets the job publish the APK to a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Installed by hand instead of android-actions/setup-android@v3, which
      # was failing on the runner image. Uses the SDK that ships on the
      # runner when present, otherwise downloads the command-line tools.
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/cmdtools && unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          set +o pipefail
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # Optional: only present if you've added the GOOGLE_SERVICES_JSON
      # secret in repo Settings → Secrets and variables → Actions (paste the
      # full contents of the google-services.json downloaded from Firebase
      # Console → Project settings → your registered Android app,
      # com.narhy.wardcharts). Without it, the app still builds fine —
      # Firebase push notifications (drug-due/glucose-check alerts) just
      # won't be wired up in this APK, same as android/app/build.gradle's
      # own fallback when the file is missing locally.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON secret set; skipping (push notifications won't work in this build)."
          fi

      # Gradle comes from the official setup action (with its own download
      # retries/caching) because the wrapper's direct download of the
      # distribution was failing on the runner.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: narhy-ward-charts-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Stable public download link, used by the /install page:
      # https://github.com/awarinelite-cpu/68-drug-course/releases/latest/download/narhy-ward-charts.apk
      # Replaces the previous release on every build so the link always serves the newest APK.
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk narhy-ward-charts.apk
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest narhy-ward-charts.apk \
            --title "NARHY Ward Charts (Android)" \
            --notes "Latest Android build. Install page: https://68-drug-course-26mw.vercel.app/install" \
            --latest
